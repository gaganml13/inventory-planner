<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sign In — Smart Business Analyzer</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body { font-family: 'Inter', sans-serif; }
  </style>
</head>
<body class="bg-slate-50 text-slate-800 min-h-screen flex flex-col justify-center py-12 sm:px-6 lg:px-8">
  <div class="sm:mx-auto sm:w-full sm:max-w-md">
    <!-- Brand Header -->
    <div class="flex items-center justify-center gap-3 mb-3">
      <div class="w-10 h-10 rounded-lg bg-indigo-600 flex items-center justify-center text-white shadow-sm">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
          <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M20 7l-8-4-8 4m16 0l-8 4m8-4v10l-8 4m0-10L4 7m8 4v10M4 7v10l8 4"/>
        </svg>
      </div>
      <div>
        <h1 class="text-xl font-bold tracking-tight text-slate-900 leading-none">Smart Business Analyzer</h1>
        <p class="text-xs text-slate-500 font-medium">Smart Demand & Replenishment</p>
      </div>
    </div>
    <h2 class="text-center text-sm text-slate-600" id="formSubtitle">Sign in to your wholesale workspace</h2>
  </div>

  <div class="mt-6 sm:mx-auto sm:w-full sm:max-w-md">
    <div class="bg-white py-8 px-6 shadow-sm border border-slate-200 rounded-xl sm:px-10">
      <!-- Error / Alert Banner -->
      <div id="alertBox" class="hidden mb-4 p-3 rounded-lg text-xs font-medium border"></div>

      <!-- Login / Register Form -->
      <form id="authForm" class="space-y-4">
        <div id="bizNameGroup" class="hidden">
          <label for="businessName" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Company / Trading Name</label>
          <input id="businessName" name="businessName" type="text" placeholder="e.g. Acme Wholesale Supplies"
            class="block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
        </div>

        <div>
          <label for="email" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Email Address</label>
          <input id="email" name="email" type="email" required autocomplete="email" placeholder="operator@company.com"
            class="block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
        </div>

        <div>
          <label for="password" class="block text-xs font-semibold text-slate-700 uppercase tracking-wider mb-1">Password</label>
          <input id="password" name="password" type="password" required autocomplete="current-password" placeholder="••••••••"
            class="block w-full px-3 py-2 border border-slate-300 rounded-lg text-sm text-slate-900 placeholder-slate-400 focus:outline-none focus:ring-2 focus:ring-indigo-500 focus:border-indigo-500 transition-colors">
        </div>

        <div>
          <button type="submit" id="submitBtn"
            class="w-full flex justify-center py-2.5 px-4 border border-transparent rounded-lg text-sm font-semibold text-white bg-indigo-600 hover:bg-indigo-700 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all shadow-sm">
            Sign In to Workspace
          </button>
        </div>
      </form>

      <div class="mt-4 flex items-center justify-between text-xs text-slate-500">
        <span id="togglePrompt">Don't have an account?</span>
        <button type="button" id="toggleModeBtn" class="font-semibold text-indigo-600 hover:text-indigo-500 focus:outline-none">
          Create New Tenant
        </button>
      </div>

      <!-- Divider -->
      <div class="mt-6 relative">
        <div class="absolute inset-0 flex items-center" aria-hidden="true">
          <div class="w-full border-t border-slate-200"></div>
        </div>
        <div class="relative flex justify-center text-xs uppercase tracking-wider">
          <span class="bg-white px-3 text-slate-400 font-medium">Or Experience Sandbox</span>
        </div>
      </div>

      <!-- Explore Demo as Guest Action -->
      <div class="mt-6">
        <button type="button" id="guestBtn"
          class="w-full flex items-center justify-center gap-2 py-2.5 px-4 border border-slate-300 rounded-lg text-sm font-semibold text-slate-700 bg-slate-50 hover:bg-slate-100 hover:border-slate-400 focus:outline-none focus:ring-2 focus:ring-offset-2 focus:ring-indigo-500 transition-all">
          <svg class="w-4 h-4 text-emerald-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M13 10V3L4 14h7v7l9-11h-7z"/>
          </svg>
          <span>Explore Demo as Guest</span>
        </button>
        <p class="mt-2 text-center text-xs text-slate-400">
          Pre-seeded with realistic SKU velocity, suppliers, sales history & ML demand forecasts.
        </p>
      </div>
    </div>
  </div>

  <script>
    let isRegisterMode = false;
    const authForm = document.getElementById('authForm');
    const bizNameGroup = document.getElementById('bizNameGroup');
    const businessNameInput = document.getElementById('businessName');
    const emailInput = document.getElementById('email');
    const passwordInput = document.getElementById('password');
    const submitBtn = document.getElementById('submitBtn');
    const togglePrompt = document.getElementById('togglePrompt');
    const toggleModeBtn = document.getElementById('toggleModeBtn');
    const formSubtitle = document.getElementById('formSubtitle');
    const alertBox = document.getElementById('alertBox');
    const guestBtn = document.getElementById('guestBtn');

    function showAlert(msg, isError = true) {
      alertBox.textContent = msg;
      alertBox.className = isError
        ? 'block mb-4 p-3 rounded-lg text-xs font-medium border bg-rose-50 text-rose-700 border-rose-200'
        : 'block mb-4 p-3 rounded-lg text-xs font-medium border bg-emerald-50 text-emerald-700 border-emerald-200';
    }

    function hideAlert() {
      alertBox.className = 'hidden mb-4 p-3 rounded-lg text-xs font-medium border';
    }

    toggleModeBtn.addEventListener('click', () => {
      isRegisterMode = !isRegisterMode;
      hideAlert();
      if (isRegisterMode) {
        bizNameGroup.classList.remove('hidden');
        submitBtn.textContent = 'Create Private Workspace';
        formSubtitle.textContent = 'Register a private tenant with clean onboarding';
        togglePrompt.textContent = 'Already have an account?';
        toggleModeBtn.textContent = 'Sign In';
      } else {
        bizNameGroup.classList.add('hidden');
        submitBtn.textContent = 'Sign In to Workspace';
        formSubtitle.textContent = 'Sign in to your wholesale workspace';
        togglePrompt.textContent = "Don't have an account?";
        toggleModeBtn.textContent = 'Create New Tenant';
      }
    });

    authForm.addEventListener('submit', async (e) => {
      e.preventDefault();
      hideAlert();
      submitBtn.disabled = true;
      submitBtn.textContent = 'Authenticating...';

      const endpoint = isRegisterMode ? '/api/auth/register' : '/api/auth/login';
      const payload = {
        email: emailInput.value.trim(),
        password: passwordInput.value
      };
      if (isRegisterMode && businessNameInput.value.trim()) {
        payload.businessName = businessNameInput.value.trim();
      }

      try {
        const res = await fetch(endpoint, {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.message || 'Authentication failed');
        }
        window.location.href = '/';
      } catch (err) {
        showAlert(err.message || 'Network error');
        submitBtn.disabled = false;
        submitBtn.textContent = isRegisterMode ? 'Create Private Workspace' : 'Sign In to Workspace';
      }
    });

    guestBtn.addEventListener('click', async () => {
      hideAlert();
      guestBtn.disabled = true;
      guestBtn.classList.add('opacity-75');

      try {
        const res = await fetch('/api/auth/guest', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' }
        });
        const data = await res.json();
        if (!res.ok || data.error) {
          throw new Error(data.message || 'Could not initialize guest session');
        }
        window.location.href = '/';
      } catch (err) {
        showAlert(err.message || 'Failed to start demo session');
        guestBtn.disabled = false;
        guestBtn.classList.remove('opacity-75');
      }
    });

    // Check if already authenticated
    (async () => {
      try {
        const res = await fetch('/api/auth/me');
        const data = await res.json();
        if (data.authenticated) {
          window.location.href = '/';
        }
      } catch (_) {}
    })();
  </script>
</body>
</html>
